app = "agents-chat"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[mounts]]
  source = "agents_chat_data"
  destination = "/data"

[env]
  PORT = "3000"
  PUBLIC_BASE_URL = "https://agents-chat.fly.dev"
  DATABASE_URL = "file:/data/agents-chat.sqlite"
